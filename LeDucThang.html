<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ôn tập Lịch sử 11</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f3f0ea;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.card{
    background:white;
    border-radius:16px;
    padding:25px;
    margin-bottom:30px;
    box-shadow:0 0 10px rgba(0,0,0,0.08);
}

.title{
    display:inline-block;
    background:#efe2c3;
    color:#b87900;
    padding:10px 16px;
    border-radius:14px;
    font-weight:bold;
    margin-bottom:20px;
}

.question{
    margin-bottom:25px;
}

.question h3{
    line-height:1.6;
}

label{
    display:block;
    margin:8px 0;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

label:hover{
    background:#f0f0f0;
}

.quote{
    background:#f8f4ec;
    padding:18px;
    border-radius:10px;
    font-style:italic;
    color:#8d671f;
    line-height:1.7;
    margin-bottom:20px;
}

.answer-row{
    background:#faf8f4;
    border-radius:12px;
    padding:16px;
    margin-bottom:15px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.answer-text{
    flex:1;
    line-height:1.7;
    font-size:17px;
}

.buttons{
    display:flex;
    gap:10px;
}

.buttons label{
    cursor:pointer;
}

.buttons input{
    display:none;
}

.btn{
    border:2px solid #ccc;
    background:white;
    padding:10px 20px;
    border-radius:30px;
    font-weight:bold;
    transition:0.2s;
}

.buttons input:checked + .btn{
    background:#d9ecff;
    border-color:#4a90e2;
}

.correct{
    background:#b7ffb7 !important;
    border-color:green !important;
}

.wrong{
    background:#ffb7b7 !important;
    border-color:red !important;
}

button{
    display:block;
    margin:30px auto;
    padding:15px 35px;
    border:none;
    border-radius:12px;
    background:#007bff;
    color:white;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

#result{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#d60000;
    margin-top:30px;
}

#timer{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#b30000;
    margin-top:20px;
}

</style>
</head>

quote:`“Năm 1397, Hồ Quý Ly cho xây dựng thành Tây Đô (thuộc Thanh Hoá ngày nay) rồi ép vua Trần dời đô về đây. Phía ngoài thành là hệ thống hào quy mô lớn kết hợp luỹ tre gai dày đặc. Năm 1402, nhà Hồ đắp sửa đường sá từ thành Tây Đô đến Hoa Châu (Thừa Thiên Huế và phía bắc Quảng Nam ngày nay). Năm 1405, nhà Hồ cho quân đóng cọc gỗ lớn ở cửa biển và những nơi xung yếu trên sông để phòng giặc, xây dựng hệ thống phòng thủ dài hàng trăm ki-lô-mét.”`,
source:"(SGK Lịch sử 11, Bộ Cánh Diều, trang 64)",
answers:[

id:24,
quote:`“Về quân sự: quần đảo Hoàng Sa và quần đảo Trường Sa có vị trí chiến lược, có thể dùng để kiểm soát các tuyến hàng hải qua lại Biển Đông, cũng như có vị thế phòng thủ chắc chắn thông qua sự liên kết giữa các đảo, cụm đảo, tuyến đảo ở hai quần đảo.”`,

id:25,
quote:`“Hiệu quả cải cách hành chính của Minh Mạng là đã tăng cường được tính thống nhất quốc gia, củng cố được vương triều Nguyễn, phần nào ổn định được xã hội sau hàng thế kỉ chiến tranh, vừa chống ngoại xâm vừa nội chiến liên miên. Nhưng bị hạn chế và không tạo nên được sức mạnh kinh tế, chính trị, văn hóa, xã hội và quan hệ quốc tế tốt đẹp, có khả năng kiềm chế được ngoại xâm”`,
source:"(Văn Tạo, Mười cuộc cải cách, đổi mới lớn trong lịch sử Việt Nam)",

{text:"b) Một trong những hiệu quả tích cực trong cải cách của vua Minh Mạng là tạo dựng được mối quan hệ tốt đẹp với bên ngoài, củng cố khối đại đoàn kết dân tộc.",correct:false},

shuffle(mcq);
shuffle(tfQuestions);

const mcqForm=document.getElementById("mcqForm");

mcq.forEach((q,index)=>{

shuffle(q.answers);

let div=document.createElement("div");

div.className="question";

let html=`<h3>${q.question}</h3>`;

q.answers.forEach(ans=>{

html += `
<label>
<input type="radio" name="mcq${index}" value="${ans.correct}">
${ans.text}
</label>
`;

});

div.innerHTML=html;

mcqForm.appendChild(div);

});

const tfContainer=document.getElementById("tfContainer");

tfQuestions.forEach((q,index)=>{

shuffle(q.answers);

let html=`

<div class="question">

<div class="title">
Câu ${q.id}
</div>

<div class="quote">
${q.quote}
</div>
`;

q.answers.forEach((a,i)=>{

html += `

<div class="answer-row">

<div class="answer-text">
${a.text}
</div>

<div class="buttons">

<label>
<input type="radio" name="tf${index}_${i}" value="true">
<div class="btn">Đúng</div>
</label>

<label>
<input type="radio" name="tf${index}_${i}" value="false">
<div class="btn">Sai</div>
</label>

</div>

</div>
`;

});

html += `</div>`;

tfContainer.innerHTML += html;

});

function submitQuiz(){

if(window.submitted) return;

window.submitted = true;

let score=0;
let total=0;

mcq.forEach((q,index)=>{

total++;

const answers=document.getElementsByName(`mcq${index}`);

answers.forEach(ans=>{

if(ans.checked){

if(ans.value==="true"){

score++;
ans.parentElement.classList.add("correct");

}else{

ans.parentElement.classList.add("wrong");

}

}

if(ans.value==="true"){

ans.parentElement.classList.add("correct");

}

});

});

tfQuestions.forEach((q,index)=>{

q.answers.forEach((a,i)=>{

total++;

const selected=
document.querySelector(`input[name="tf${index}_${i}"]:checked`);

const labels=
document.querySelectorAll(`input[name="tf${index}_${i}"]`);

labels.forEach(lb=>{

const userAnswer=lb.value==="true";

if(userAnswer===a.correct){

lb.nextElementSibling.classList.add("correct");

}

});

if(selected){

const userAnswer=
selected.value==="true";

const button=
selected.nextElementSibling;

if(userAnswer===a.correct){

button.classList.add("correct");
score++;

}else{

button.classList.add("wrong");

}

}

});

});

document.getElementById("result").innerHTML=
`🎯 Bạn đúng ${score}/${total} ý`;

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

let time=45*60;

const timer=document.getElementById("timer");

const countdown=setInterval(()=>{

let minutes=Math.floor(time/60);
let seconds=time%60;

if(seconds<10){
seconds="0"+seconds;
}

timer.innerHTML=`⏰ ${minutes}:${seconds}`;

time--;

if(time<0){

clearInterval(countdown);

alert("Hết giờ!");

submitQuiz();

}

},1000);

</script>
